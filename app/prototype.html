<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invite prototypes</title>
<style>
  body { margin: 0; min-height: 100vh; font: 15px/1.5 system-ui, sans-serif; background: #f4f4f5; color: #18181b; }
  .page { max-width: 42rem; margin: 0 auto; padding: 3rem 1.5rem 8rem; }
  .page > p { color: #52525b; }
  input { font: inherit; padding: 0.5rem 0.75rem; border: 1px solid #d4d4d8; border-radius: 8px; width: 100%; box-sizing: border-box; }
  .send { font: inherit; margin-top: 0.75rem; padding: 0.5rem 1rem; border-radius: 8px; border: 0; background: #18181b; color: #fff; cursor: pointer; }
  .send:active { transform: scale(0.97); }
  .quiet { border: 1px solid #e4e4e7; border-radius: 10px; padding: 1.25rem; background: #fff; }
  .editorial { padding: 2.5rem 0; }
  .editorial h2 { font-size: 2.5rem; line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 1rem; }
  .playful { border-radius: 24px; padding: 1.5rem; background: #fef3c7; animation: enter 300ms cubic-bezier(0.23, 1, 0.32, 1); }
  .playful .send { background: #d97706; border-radius: 99px; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px) scale(0.97); } }
  @media (prefers-reduced-motion: reduce) { .playful { animation-name: fade; } @keyframes fade { from { opacity: 0; } } }
  /* ---- The picker: PICKER.md, verbatim ---- */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}

/* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}

@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}

.proto-picker-item {
  position: relative; /* sits above the highlight */
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}

.proto-picker-item:hover {
  color: rgba(255, 255, 255, 0.85);
}

.proto-picker-item:active {
  transform: scale(0.97);
}

.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}

.proto-picker-item[data-active] {
  color: #fff;
}

.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}

.proto-picker-replay {
  padding: 0 10px;
  font-size: 14px;
}

.proto-picker[data-position="top"] {
  bottom: auto;
  top: 24px;
}
</style>
</head>
<body>
<div class="page">
  <h1>Team settings</h1>
  <p>People in Northwind Studio can see every project.</p>
  <div id="stage"></div>
</div>
<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Quiet</button>
  <button class="proto-picker-item">Editorial</button>
  <button class="proto-picker-item">Playful</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>
<script>
const fixed = new URLSearchParams(location.search).has('fixed');
const form = (cls, title, cta) => `
  <form class="${cls}" onsubmit="event.preventDefault(); this.querySelector('[role=status]').textContent = 'Invite sent to ' + this.email.value">
    <h2>${title}</h2>
    <label>Email <input name="email" type="email" autocomplete="email" placeholder="aleksandra@northwind.example.com"></label>
    <button class="send">${cta}</button>
    <p role="status"></p>
  </form>`;
const variants = [
  () => form('quiet', 'Invite a teammate', 'Send invite'),
  () => { if (!fixed) console.error('Warning: Each child in a list should have a unique "key" prop.'); return form('editorial', 'Bring your team in.', 'Send invite'); },
  // Before: the playful variant's button is dead (type=button, no handler).
  () => fixed ? form('playful', 'Invite your crew 👋', 'Send it') : form('playful', 'Invite your crew 👋', 'Send it').replace('class="send"', 'class="send" type="button"'),
];
// ---- The picker wiring: PICKER.md, verbatim except the three marked before-version deviations ----
// `variants` is an array of render functions, one per variant, in picker order.
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  if (!fixed) { stage.animate([{ opacity: 0 }, { opacity: 1 }], 300); } // before: the swap animates
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  if (fixed) history.replaceState(null, '', url); // before: the choice is lost on reload
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (fixed && (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable)) return; // before: typing a 2 switches variant
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
